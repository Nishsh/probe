name: build-unsigned-ipa

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      - name: 编译并打包未签名 IPA
        run: |
          chmod +x ./build_ipa.sh
          ./build_ipa.sh

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: Probe-unsigned-ipa
          path: build/Probe-unsigned.ipa
          if-no-files-found: error
